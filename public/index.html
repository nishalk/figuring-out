<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relay · Kuwait Delivery</title><link rel="stylesheet" href="/style.css"><body><header><div><b>◈ RELAY</b><small>Kuwait delivery operations</small></div><button id="logout" hidden>Sign out</button></header><main id="app"></main><dialog id="proof"><form id="proofForm"><h2>Proof of handover</h2><label>Person’s name<input name="name" required></label><label>Photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required></label><p>Recipient signature</p><canvas width="320" height="150"></canvas><button type="button" id="clear">Clear signature</button><p>GPS is captured when you submit. Allow location access.</p><button>Save proof</button><button type="button" id="cancel">Cancel</button></form></dialog><script src="/app.js"></script></body></html>
